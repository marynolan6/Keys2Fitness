name: Screen branding
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: K2F
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: K2F/package-lock.json
      - run: npm ci
      - run: npm run check:branding
